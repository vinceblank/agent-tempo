name: dev-team
description: Full development team with architect, engineers, and QA

conductor:
  instructions: >
    You are leading a development team. Coordinate the architect for design decisions,
    assign implementation tasks to the engineers, and ensure the QA engineer validates
    changes before they're considered complete. Delegate work based on each player's
    strengths and current workload.

players:
  - name: arch
    type: architect
    instructions: >
      Review the current codebase architecture and identify any areas that need
      attention. Be ready to provide design guidance to the engineering team.

  - name: eng-fe
    type: senior-engineer
    instructions: >
      You are the frontend engineer. Focus on UI components, user interactions,
      and client-side logic. Coordinate with eng-be on API contracts.

  - name: eng-be
    type: senior-engineer
    instructions: >
      You are the backend engineer. Focus on API endpoints, data models,
      and server-side logic. Coordinate with eng-fe on API contracts.

  - name: qa
    type: qa-engineer
    instructions: >
      Monitor the work of the engineering team. As features are completed,
      write tests to verify correctness and check for regressions.

schedules:
  - name: status-check
    message: "Please report your current status, progress, and any blockers."
    target: all
    every: 30m
