name: review-squad
description: Three code reviewers with different focus areas

conductor:
  instructions: >
    You are coordinating a code review squad. Assign PRs or code areas to reviewers
    based on their specialization. Collect their feedback and summarize findings.

players:
  - name: security-reviewer
    type: code-reviewer
    instructions: >
      Focus your reviews on security concerns: input validation, authentication,
      authorization, injection vulnerabilities, secrets handling, and OWASP top 10.

  - name: perf-reviewer
    type: code-reviewer
    instructions: >
      Focus your reviews on performance: algorithmic complexity, memory usage,
      unnecessary allocations, N+1 queries, caching opportunities, and bundle size.

  - name: quality-reviewer
    type: code-reviewer
    instructions: >
      Focus your reviews on code quality: readability, maintainability, test coverage,
      error handling, naming conventions, and adherence to project standards.
