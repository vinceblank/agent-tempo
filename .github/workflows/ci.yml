name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path-filter gate — used by the heavy matrix jobs to skip work when a
  # PR is docs-only (#354) and as part of the smoke-tripwire pattern that
  # also short-circuits a redundant CI re-run on `main` after a squash-
  # merge (#355). `code` outputs `true` iff the PR touches at least one
  # file outside the docs allowlist; the heavy jobs combine this with a
  # `github.event_name` gate so:
  #   - pull_request + code change → full matrix
  #   - pull_request + docs-only   → only lint-* jobs (the tripwires)
  #   - push to main               → only lint-* jobs (PR matrix already
  #                                  validated the byte-identical tree)
  #   - workflow_dispatch          → full matrix (manual runs always full)
  #
  # `examples/**` is intentionally OUT of the docs allowlist — shipped
  # lineup YAMLs and agent definitions in `examples/` are runtime
  # resources that tests reference. Conservative call; widen later if
  # the heavy-matrix-on-examples-only-edit waste shows up in practice.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `predicate-quantifier: every` is REQUIRED for the negation
          # patterns below to behave subtractively (gitignore-style).
          # Without it dorny defaults to `some` — meaning a file matches
          # the rule if ANY pattern matches. With our list, the `**`
          # line always wins on any diff, so `code = true` fires
          # universally and the docs allowlist is silently ignored.
          # That was the bug behind #354's matrix-skip not triggering
          # (PRs #511, #515, #517 ran the full matrix on docs-only
          # diffs even though this filter was already in place).
          # See https://github.com/dorny/paths-filter#predicate-quantifier
          # for the action's own writeup of this footgun. Don't drop
          # this property — it's the difference between OR and AND
          # combination of the patterns.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  lint-test-ensemble:
    # Fast grep-based lint — guards against accidental `'test-ensemble'` literals
    # outside `test/helpers.ts` (#210). Runs first so the matrix doesn't start
    # three Node versions on a PR that will fail the literal check regardless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for stray `test-ensemble` literals in test/
        run: bash scripts/check-test-ensemble-literals.sh
      - name: Check this.skip() calls have SKIP-REASON annotations
        run: node scripts/lint-skip-reasons.js

  lint-surface-drift:
    # Fast registry drift check — guards against undocumented or phantom surface
    # entries in docs/SURFACE-REGISTRY.md (#305 / #333).
    # No build or npm install needed — pure file parsing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check surface registry against source
        run: node scripts/check-surface-drift.js

  dashboard-build:
    # PR-2 of #340 — Vite + Tailwind 4 + AppShell scaffold.
    # Independent install (`dashboard/` has its own package-lock.json) so the
    # main TypeScript build doesn't pay the dashboard's npm-ci cost. Cache key
    # on dashboard/package-lock.json avoids re-fetching node_modules on every
    # PR that doesn't touch the dashboard.
    #
    # **Job cloning note**: if you copy this job for another dashboard-
    # related CI step (e.g. `dashboard-e2e`, future `dashboard-perf`),
    # copy ALL setup steps — especially "Install root dependencies".
    # The dashboard's `agent-tempo/*` path alias drags `../src/*` into
    # `tsc -b`, which fails to resolve `@temporalio/client` / `yaml` /
    # `zod` without root `node_modules`. The fix is non-obvious unless
    # you've debugged it once. Tracked in #368.
    runs-on: ubuntu-latest
    needs: [lint-test-ensemble, changes]
    # #354 + #355: skip on docs-only PRs and on push-to-main (PR matrix
    # already validated the byte-identical tree). Run on workflow_dispatch
    # unconditionally so manual triggers always exercise the full matrix.
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          # `check-components-css-sync.ts` (PR-B of #454) reads the LAST-SYNC
          # commit out of components.css and runs `git diff` against the
          # canonical CSS. With the default shallow checkout (depth=1) the
          # LAST-SYNC commit isn't in the local object DB and the diff fails.
          # `fetch-depth: 0` pulls full history; the script's own self-heal
          # falls back to `git fetch origin <sha>` for safety, but full
          # history is the cheapest fix and matches GitHub's documented
          # pattern for jobs that touch git history.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Root npm cache — needed because the dashboard's `agent-tempo/*`
          # path alias drags `../src/*` into `tsc -b` (see PR-4 of #340), and
          # those parent files import `@temporalio/client` / `yaml` / `zod`
          # from root `node_modules`. Without root deps, lint + tests + build
          # fail with "Cannot find module '@temporalio/client'". Tracked in #368.
          cache: npm

      - name: Cache dashboard/node_modules
        uses: actions/cache@v5
        with:
          path: dashboard/node_modules
          key: dashboard-node-modules-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: |
            dashboard-node-modules-

      - name: Lockstep version check (root === dashboard)
        # ADR 0013: dashboard pins in lockstep with agent-tempo. CI enforces
        # `dashboard/package.json#version` matches root so a release never
        # ships a stale dashboard against a new daemon.
        run: |
          ROOT_VER=$(node -p "require('./package.json').version")
          DASH_VER=$(node -p "require('./dashboard/package.json').version")
          if [ "$ROOT_VER" != "$DASH_VER" ]; then
            echo "::error::Version drift: root=$ROOT_VER dashboard=$DASH_VER"
            echo "Bump dashboard/package.json#version to match root."
            exit 1
          fi
          echo "Lockstep OK: $ROOT_VER"

      - name: Install root dependencies (for path-alias type resolution)
        # The dashboard's `agent-tempo/*` path alias resolves to `../src/*`,
        # whose files import `@temporalio/client`, `yaml`, and `zod` from
        # root `node_modules`. `tsc -b` walks those imports during type
        # checking; without root deps the build fails with "Cannot find
        # module '@temporalio/client'". `--ignore-scripts` skips the
        # parent's `prepare` / `prepublishOnly` hooks since we only need
        # node_modules for module resolution, not the parent's build.
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        # Strict-mode install — fails fast on `dashboard/package-lock.json`
        # drift so a forgotten `npm install` (qa's PR-2 follow-up) can't
        # leak into a release.
        run: npm --prefix dashboard ci

      - name: Lint dashboard
        run: npm --prefix dashboard run lint

      - name: Test dashboard (Vitest)
        run: npm --prefix dashboard run test

      - name: Build dashboard
        run: npm --prefix dashboard run build

      - name: components.css canonical-port drift report (F-LEAD-1, PR-B of #454)
        # Reads the LAST-SYNC marker out of dashboard/src/styles/components.css
        # and reports drift against the canonical hand-off bundle at
        # docs/design/dashboard-handoff/project/styles.css. WARN at 50 lines,
        # FAIL at 150 lines. Re-sync procedure lives at
        # docs/design/components-css-port-procedure.md.
        run: npm run build:scripts && node dist/scripts/check-components-css-sync.js

      - name: Verify tarball includes dashboard/dist
        # Defense-in-depth check at PR time. Catches the v0.28.0-beta.4
        # regression where dashboard/.gitignore (used by `npm pack` as the
        # .npmignore fallback) silently excluded dashboard/dist from the
        # published tarball. release.yml runs the same check before publish,
        # but failing here means a bad PR is rejected at review time instead
        # of at tag-push time when devops cuts the next beta.
        run: npm run verify-tarball

      - name: Install root size-limit
        # Run size-limit at the repo root against `dashboard/dist/`.
        # `npm ci` would also install the rest of the root devDeps; keep it
        # narrow with `npm install size-limit` to stay snappy.
        run: npm install --no-save size-limit

      - name: Bundle budget (size-limit)
        run: npx size-limit

  dashboard-e2e:
    # PR-8 of #340 — Playwright smoke pack against a tiny in-process
    # test daemon (see `dashboard/e2e/test-daemon.ts`). One browser
    # (chromium) keeps the CI cost addition under ~2 min.
    runs-on: ubuntu-latest
    needs: dashboard-build
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Root npm cache — same reason as `dashboard-build`: the
          # dashboard's `agent-tempo/*` path alias drags `../src/*`
          # into `tsc -b`, and parent files import @temporalio/* + yaml
          # + zod from root `node_modules`.
          cache: npm

      - name: Cache dashboard/node_modules
        uses: actions/cache@v5
        with:
          path: dashboard/node_modules
          key: dashboard-node-modules-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: |
            dashboard-node-modules-

      - name: Cache Playwright browsers
        # ~150 MB of chromium binaries — re-downloading on every CI
        # run would dwarf the test wall-clock. Keyed on the lockfile
        # so a Playwright bump (which usually pins a chromium SHA)
        # invalidates the cache.
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('dashboard/package-lock.json') }}

      - name: Install root dependencies (for path-alias type resolution)
        # Mirrors the same step in `dashboard-build`. The dashboard's
        # `agent-tempo/*` path alias resolves to `../src/*`, whose
        # files import @temporalio/client / yaml / zod from root
        # `node_modules`. `tsc -b` (run by `dashboard run build`) walks
        # those imports during type checking; without root deps the
        # build fails with "Cannot find module '@temporalio/client'".
        # `--ignore-scripts` skips the parent's prepare/prepublishOnly
        # hooks since we only need node_modules for module resolution.
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci

      - name: Build dashboard (e2e needs the dist/)
        run: npm --prefix dashboard run build

      - name: Install Playwright chromium
        run: npm --prefix dashboard run test:e2e:install

      - name: Run Playwright smoke pack
        run: npm --prefix dashboard run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7

  dashboard-overflow:
    # PR-v0 of #461 — overflow + content-length CI guardrail. Path B
    # clone of `dashboard-e2e` per audit §10.3 step 5: independent job
    # so failures attribute cleanly to the overflow surface, and so the
    # `continue-on-error` flag (justified below) doesn't bleed into
    # the e2e smoke pack's strict gating.
    #
    # **continue-on-error rationale**: this job runs assertions that
    # encode the post-fix state for confirmed P1/P2 findings; some of
    # those will fail until PR-α (the CSS cluster fix) lands. Running
    # the job surfaces failures + uploads the report for diagnosis,
    # but doesn't block merges during the staged rollout. After PR-α
    # lands and assertions flip green, remove `continue-on-error`.
    # See `dashboard/tests-overflow/README.md` for the staging story.
    runs-on: ubuntu-latest
    needs: dashboard-build
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache dashboard/node_modules
        uses: actions/cache@v5
        with:
          path: dashboard/node_modules
          key: dashboard-node-modules-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: |
            dashboard-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('dashboard/package-lock.json') }}

      - name: Install root dependencies (for path-alias type resolution)
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci

      - name: Build dashboard (overflow specs need /dashboard/assets/components.css)
        run: npm --prefix dashboard run build

      - name: Install Playwright chromium
        run: npm --prefix dashboard run test:e2e:install

      - name: Run overflow guardrail
        # PR-α (the CSS cluster fix) is on main; this branch is rebased
        # onto it, so confirmed-finding assertions assert the post-fix
        # state and pass. Refutation regression locks (H4A, H10, H11,
        # H13, H12, H14) protect proven-safe patterns against future
        # regression. Strict gating from here on.
        run: npm --prefix dashboard run test:overflow

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-overflow-report
          path: dashboard/playwright-report/
          retention-days: 7

  build-and-test:
    # Mocha integration suite, sharded 2-way per docs/design/191-test-parallelization.md §2
    # (#231). Rule: shard-1 pins the top-N heaviest files by CI wall-clock
    # (currently N=3 — see `test/shard-config.json`); shard-2 runs the rest
    # via the default spec minus shard-1 via `--ignore`. Single source of
    # truth is `test/shard-config.json`. Rebalance rule (20% drift bound)
    # and shard-move procedure live in `test/README.md`.
    #
    # TUI (vitest) runs as a separate job below — no need to duplicate it across
    # every Mocha shard × Node combination.
    runs-on: ubuntu-latest
    needs: [lint-test-ensemble, changes]
    # #354 + #355: skip on docs-only PRs and on push-to-main.
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        shard: [1, 2]
    name: build-and-test (shard-${{ matrix.shard }}, node-${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache Temporal test server binary
        # Pre-cache the Temporal test server binary so TestWorkflowEnvironment.createLocal()
        # is always a filesystem hit during tests — eliminates the in-test download race that
        # leaves stale `.downloading` lock files and trips the 20s timeout (#694 / #642).
        # Cache key includes SDK version so a @temporalio/testing bump auto-invalidates.
        # ⚠️  VERSION NOTE: update "1.15.0" in path + key when bumping @temporalio/testing.
        uses: actions/cache@v5
        with:
          path: /tmp/temporal-sdk-typescript-1.15.0  # update on @temporalio/testing bump
          key: temporal-test-server-linux-1.15.0     # update on @temporalio/testing bump

      - name: Remove stale Temporal download lock
        # Safety sweep: if a prior run crashed mid-download the `.downloading` lock file
        # persists on the runner image and causes a 20s stall + failure on the next run.
        # This is a no-op when no stale lock exists (the binary is cache-restored above).
        # ⚠️  VERSION NOTE: update "1.15.0" here when bumping @temporalio/testing.
        run: rm -f /tmp/temporal-sdk-typescript-1.15.0.downloading

      - name: Run Mocha shard ${{ matrix.shard }}
        id: mocha
        run: |
          start=$(date +%s)
          npm run test:shard-${{ matrix.shard }}
          end=$(date +%s)
          echo "duration=$(( end - start ))" >> "$GITHUB_OUTPUT"

      - name: Post shard wall-clock to job summary
        if: always()
        run: |
          echo "### Shard ${{ matrix.shard }} (Node ${{ matrix.node-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mocha wall-clock: **${{ steps.mocha.outputs.duration }}s**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rebalance when per-shard wall-clock drifts >20% between \`shard-1\` and \`shard-2\`. See \`test/README.md\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Save shard wall-clock for drift gate
        if: success() && steps.mocha.outputs.duration != ''
        run: |
          mkdir -p shard-walltime
          echo "${{ steps.mocha.outputs.duration }}" > "shard-walltime/shard-${{ matrix.shard }}-node-${{ matrix.node-version }}.txt"

      - name: Upload shard wall-clock artifact
        if: success() && steps.mocha.outputs.duration != ''
        uses: actions/upload-artifact@v6
        with:
          name: shard-walltime-${{ matrix.shard }}-${{ matrix.node-version }}
          path: shard-walltime/
          retention-days: 1
          if-no-files-found: error

  shard-drift-check:
    # ADR-style guard for the shard rebalance rule documented in
    # `test/shard-config.json` and `test/README.md`. The rule says: when the
    # ratio of `shard-2` to `shard-1` Mocha wall-clock exceeds 1.2× over 3+
    # runs, rebalance shards. Today the rule is comment-only — a regression
    # like the one that bit PR #382 (mock-adapter test landed in shard-2
    # while drift was already at 1.17×, pushing pre-existing heavy tests
    # over their per-test timeouts) only surfaces post-merge.
    #
    # This job hard-fails the PR when the ratio crosses 1.2×, forcing
    # rebalance at PR-time. It runs after the Linux matrix completes,
    # consumes the per-job wall-clock artifacts uploaded above, and computes
    # avg(shard-2) / avg(shard-1) across the 3 Node versions. Linux-only
    # (Windows has only 1 Node version → too few data points; same shard
    # config drives both, so a Linux drift signal implies the same on
    # Windows in absolute terms even if scale differs).
    #
    # Skipped when any matrix job failed — drift signal is meaningless if a
    # shard exited early on a test failure rather than completing wall-clock.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ success() }}
    name: shard-drift-check
    steps:
      - name: Download all shard wall-clock artifacts
        uses: actions/download-artifact@v7
        with:
          path: shard-walltime
          pattern: shard-walltime-*
          merge-multiple: true

      - name: Compute drift ratio + hard-fail at 1.2×
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const dir = 'shard-walltime';
          if (!fs.existsSync(dir)) {
            console.log('No wall-clock artifacts found — skipping drift check.');
            process.exit(0);
          }
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.txt'));
          const buckets = { '1': [], '2': [] };
          for (const f of files) {
            // Filename shape: shard-<N>-node-<V>.txt
            const m = f.match(/^shard-(\d+)-node-(\d+)\.txt$/);
            if (!m) continue;
            const shard = m[1];
            if (!(shard in buckets)) continue;
            const seconds = parseInt(fs.readFileSync(path.join(dir, f), 'utf8').trim(), 10);
            if (Number.isFinite(seconds) && seconds > 0) buckets[shard].push(seconds);
          }
          const summary = ['## Shard wall-clock drift gate', ''];
          if (buckets['1'].length === 0 || buckets['2'].length === 0) {
            console.log(`Insufficient data — shard-1 runs: ${buckets['1'].length}, shard-2 runs: ${buckets['2'].length}. Skipping.`);
            summary.push(`Insufficient data — shard-1 runs: ${buckets['1'].length}, shard-2 runs: ${buckets['2'].length}. Skipping drift check.`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
            process.exit(0);
          }
          const avg = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
          const avg1 = avg(buckets['1']);
          const avg2 = avg(buckets['2']);
          const ratio = Math.max(avg1, avg2) / Math.min(avg1, avg2);
          const heavier = avg2 > avg1 ? 'shard-2' : 'shard-1';
          summary.push(`- shard-1 wall-clock avg: **${avg1.toFixed(1)}s** (${buckets['1'].length} run${buckets['1'].length === 1 ? '' : 's'})`);
          summary.push(`- shard-2 wall-clock avg: **${avg2.toFixed(1)}s** (${buckets['2'].length} run${buckets['2'].length === 1 ? '' : 's'})`);
          summary.push(`- drift ratio (max/min): **${ratio.toFixed(3)}×** (${heavier} heavier)`);
          summary.push('');
          console.log(`shard-1 avg: ${avg1.toFixed(1)}s (${buckets['1'].length} runs)`);
          console.log(`shard-2 avg: ${avg2.toFixed(1)}s (${buckets['2'].length} runs)`);
          console.log(`ratio: ${ratio.toFixed(3)}× (${heavier} heavier)`);
          const LIMIT = 1.2;
          if (ratio > LIMIT) {
            const msg =
              `Shard wall-clock drift ${ratio.toFixed(3)}× exceeds the ${LIMIT}× design limit. ` +
              `The next CI runner-contention window will push pre-existing heavy tests over per-test timeouts ` +
              `(this is exactly how PR #382's CI flake materialised). Rebalance shards by editing ` +
              `\`test/shard-config.json\`; see \`test/README.md\` for the procedure.`;
            console.error(msg);
            summary.push(`> ❌ **Drift exceeds ${LIMIT}× — rebalance required.** See \`test/README.md\`.`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
            process.stdout.write(`::error::${msg}\n`);
            process.exit(1);
          }
          summary.push(`> ✅ Drift within ${LIMIT}× design limit.`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          EOF

  test-tui:
    # Vitest suite (tests/tui + tests/client). Independent of Mocha, so it runs
    # once across the Node matrix rather than per Mocha shard.
    runs-on: ubuntu-latest
    needs: [lint-test-ensemble, changes]
    # #354 + #355: skip on docs-only PRs and on push-to-main.
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Vitest (TUI + client)
        run: npm run test:tui

  build-and-test-windows:
    # #150 — continuous Windows coverage for the EACCES regression on
    # `TestWorkflowEnvironment.createLocal()`. Single Node version to limit
    # cost (the original tradeoff documented when this job was 1× full-suite),
    # but now sharded 2-way per the same `test/shard-config.json` Linux uses.
    #
    # Why this changed (#382 followup): the unsharded full-suite run hit
    # rolling per-test timeouts on Windows under runner contention — different
    # heavy test failed each rerun (`pause-resume`, `outbox >
    # submitOutboxUpdate basics`, `adapter-claude-code-lifecycle-v2`). The
    # `agent-tempo --dev daemon up` ramp-up + Temporal createLocal cost lands
    # roughly 2× on Windows vs Linux; running the entire suite serially
    # against a single 30s/60s per-test cap left no headroom. Sharding cuts
    # per-job wall-clock roughly in half so the heaviest tests have margin.
    #
    # Cost: 1 → 2 Windows jobs (~14% bump in total CI surface, well under
    # the 17% headroom budget the original 1-job design carved out).
    #
    # Single Node version (22) is intentional — Windows surfaces an
    # OS-specific failure mode, not a Node-version-specific one. Linux
    # provides cross-Node coverage; doubling Windows jobs by adding a Node
    # dimension would push the CI surface past the budget without adding
    # bug-detection power.
    runs-on: windows-latest
    needs: [lint-test-ensemble, changes]
    # #354 + #355: skip on docs-only PRs and on push-to-main.
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: build-and-test-windows (shard-${{ matrix.shard }}, node-22)

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache Temporal test server binary (Windows)
        # Mirror of the Linux cache step above — binary name includes .exe on Windows.
        # Path uses ${{ env.TEMP }} which maps to os.tmpdir() on Windows runners (not
        # runner.temp which is a different Actions-specific dir).
        # ⚠️  VERSION NOTE: update "1.15.0" in path + key when bumping @temporalio/testing.
        uses: actions/cache@v5
        with:
          path: ${{ env.TEMP }}\temporal-sdk-typescript-1.15.0.exe  # update on @temporalio/testing bump
          key: temporal-test-server-windows-1.15.0                  # update on @temporalio/testing bump

      - name: Remove stale Temporal download lock (Windows)
        # Node-based sweep so it works regardless of which shell is active.
        # ⚠️  VERSION NOTE: update "1.15.0" here when bumping @temporalio/testing.
        shell: bash
        run: |
          node -e "
          const{join}=require('path'),{tmpdir}=require('os'),{rmSync,existsSync}=require('fs');
          const lock=join(tmpdir(),'temporal-sdk-typescript-1.15.0.downloading');
          if(existsSync(lock)){rmSync(lock);console.log('Removed stale lock:',lock);}
          else{console.log('No stale lock found.');}
          "

      - name: Run Mocha shard ${{ matrix.shard }}
        # Force bash on Windows — the default shell is PowerShell, where the
        # `start=$(date +%s)` syntax + `&&` semantics differ from POSIX. Git
        # Bash ships with the windows-latest runner image so this is free.
        shell: bash
        id: mocha
        run: |
          start=$(date +%s)
          npm run test:shard-${{ matrix.shard }}
          end=$(date +%s)
          echo "duration=$(( end - start ))" >> "$GITHUB_OUTPUT"

      - name: Post shard wall-clock to job summary
        if: always()
        shell: bash
        run: |
          echo "### Windows shard ${{ matrix.shard }} (Node 22)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mocha wall-clock: **${{ steps.mocha.outputs.duration }}s**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

  # ── #547 — Synthetic success reporters for docs-only PRs ─────────────────
  #
  # Problem: branch protection lists specific status check names as required.
  # Those names come from the matrix-expanded `name:` fields of the heavy
  # test jobs (build-and-test, test-tui, build-and-test-windows) plus the
  # single dashboard and drift-check jobs. On docs-only PRs all of those jobs
  # are SKIPPED (`code == 'false'`). GitHub branch protection treats a skipped
  # required check as "not reported" — indistinguishable from a missing job —
  # and blocks the merge.
  #
  # Fix: add a noop companion for every skippable required check. Each noop
  # shares the exact same `name:` as its real counterpart (GitHub matches on
  # `name:`, not job id) and runs ONLY when the real job is skipped. The two
  # branches are mutually exclusive:
  #   - code PR  → real jobs run, noops skip  (noop `if` is false)
  #   - docs PR  → noops run, real jobs skip  (real `if` is false)
  #   - push/dispatch → neither set's noop runs (noops gate on pull_request)
  #
  # See https://github.com/vinceblank/agent-tempo/issues/547 for root-cause
  # analysis and the branch-protection check name inventory.

  build-and-test-noop:
    name: build-and-test (shard-${{ matrix.shard }}, node-${{ matrix.node-version }})
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        shard: [1, 2]
    steps:
      - run: echo "docs-only PR — test matrix skipped"

  test-tui-noop:
    name: test-tui (${{ matrix.node-version }})
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - run: echo "docs-only PR — TUI vitest skipped"

  build-and-test-windows-noop:
    name: build-and-test-windows (shard-${{ matrix.shard }}, node-22)
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - run: echo "docs-only PR — Windows shard skipped"

  shard-drift-check-noop:
    name: shard-drift-check
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - run: echo "docs-only PR — shard drift check skipped"

  dashboard-build-noop:
    name: dashboard-build
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - run: echo "docs-only PR — dashboard build skipped"

  dashboard-e2e-noop:
    name: dashboard-e2e
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - run: echo "docs-only PR — dashboard e2e skipped"

  dashboard-overflow-noop:
    name: dashboard-overflow
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - run: echo "docs-only PR — dashboard overflow skipped"

  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check conventional commits
        run: |
          # Verify all PR commits follow conventional commit format
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad_commits=""
          while IFS= read -r line; do
            sha="${line%% *}"
            msg="${line#* }"
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
              bad_commits="${bad_commits}\n  ${sha:0:7} ${msg}"
            fi
          done <<< "$(git log --oneline "$base".."$head")"
          if [ -n "$bad_commits" ]; then
            echo "::warning::Some commits don't follow conventional commit format:${bad_commits}"
          fi
