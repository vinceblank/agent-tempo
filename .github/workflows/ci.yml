name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-ensemble:
    # Fast grep-based lint — guards against accidental `'test-ensemble'` literals
    # outside `test/helpers.ts` (#210). Runs first so the matrix doesn't start
    # three Node versions on a PR that will fail the literal check regardless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for stray `test-ensemble` literals in test/
        run: bash scripts/check-test-ensemble-literals.sh
      - name: Check this.skip() calls have SKIP-REASON annotations
        run: node scripts/lint-skip-reasons.js

  lint-surface-drift:
    # Fast registry drift check — guards against undocumented or phantom surface
    # entries in docs/SURFACE-REGISTRY.md (#305 / #333).
    # No build or npm install needed — pure file parsing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check surface registry against source
        run: node scripts/check-surface-drift.js

  dashboard-build:
    # PR-2 of #340 — Vite + Tailwind 4 + AppShell scaffold.
    # Independent install (`dashboard/` has its own package-lock.json) so the
    # main TypeScript build doesn't pay the dashboard's npm-ci cost. Cache key
    # on dashboard/package-lock.json avoids re-fetching node_modules on every
    # PR that doesn't touch the dashboard.
    runs-on: ubuntu-latest
    needs: lint-test-ensemble
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Root npm cache — needed because the dashboard's `claude-tempo/*`
          # path alias drags `../src/*` into `tsc -b` (see PR-4 of #340), and
          # those parent files import `@temporalio/client` / `yaml` / `zod`
          # from root `node_modules`. Without root deps, lint + tests + build
          # fail with "Cannot find module '@temporalio/client'". Tracked in #368.
          cache: npm

      - name: Cache dashboard/node_modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: dashboard-node-modules-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: |
            dashboard-node-modules-

      - name: Lockstep version check (root === dashboard)
        # ADR 0013: dashboard pins in lockstep with claude-tempo. CI enforces
        # `dashboard/package.json#version` matches root so a release never
        # ships a stale dashboard against a new daemon.
        run: |
          ROOT_VER=$(node -p "require('./package.json').version")
          DASH_VER=$(node -p "require('./dashboard/package.json').version")
          if [ "$ROOT_VER" != "$DASH_VER" ]; then
            echo "::error::Version drift: root=$ROOT_VER dashboard=$DASH_VER"
            echo "Bump dashboard/package.json#version to match root."
            exit 1
          fi
          echo "Lockstep OK: $ROOT_VER"

      - name: Install root dependencies (for path-alias type resolution)
        # The dashboard's `claude-tempo/*` path alias resolves to `../src/*`,
        # whose files import `@temporalio/client`, `yaml`, and `zod` from
        # root `node_modules`. `tsc -b` walks those imports during type
        # checking; without root deps the build fails with "Cannot find
        # module '@temporalio/client'". `--ignore-scripts` skips the
        # parent's `prepare` / `prepublishOnly` hooks since we only need
        # node_modules for module resolution, not the parent's build.
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        run: npm --prefix dashboard install

      - name: Lint dashboard
        run: npm --prefix dashboard run lint

      - name: Test dashboard (Vitest)
        run: npm --prefix dashboard run test

      - name: Build dashboard
        run: npm --prefix dashboard run build

      - name: Install root size-limit
        # Run size-limit at the repo root against `dashboard/dist/`.
        # `npm ci` would also install the rest of the root devDeps; keep it
        # narrow with `npm install size-limit` to stay snappy.
        run: npm install --no-save size-limit

      - name: Bundle budget (size-limit)
        run: npx size-limit

  build-and-test:
    # Mocha integration suite, sharded 2-way per docs/design/191-test-parallelization.md §2
    # (#231). Rule: shard-1 pins the top-N heaviest files by CI wall-clock
    # (currently N=3 — see `test/shard-config.json`); shard-2 runs the rest
    # via the default spec minus shard-1 via `--ignore`. Single source of
    # truth is `test/shard-config.json`. Rebalance rule (20% drift bound)
    # and shard-move procedure live in `test/README.md`.
    #
    # TUI (vitest) runs as a separate job below — no need to duplicate it across
    # every Mocha shard × Node combination.
    runs-on: ubuntu-latest
    needs: lint-test-ensemble
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        shard: [1, 2]
    name: build-and-test (shard-${{ matrix.shard }}, node-${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Mocha shard ${{ matrix.shard }}
        id: mocha
        run: |
          start=$(date +%s)
          npm run test:shard-${{ matrix.shard }}
          end=$(date +%s)
          echo "duration=$(( end - start ))" >> "$GITHUB_OUTPUT"

      - name: Post shard wall-clock to job summary
        if: always()
        run: |
          echo "### Shard ${{ matrix.shard }} (Node ${{ matrix.node-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mocha wall-clock: **${{ steps.mocha.outputs.duration }}s**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rebalance when per-shard wall-clock drifts >20% between \`shard-1\` and \`shard-2\`. See \`test/README.md\`." >> "$GITHUB_STEP_SUMMARY"

  test-tui:
    # Vitest suite (tests/tui + tests/client). Independent of Mocha, so it runs
    # once across the Node matrix rather than per Mocha shard.
    runs-on: ubuntu-latest
    needs: lint-test-ensemble
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Vitest (TUI + client)
        run: npm run test:tui

  build-and-test-windows:
    # #150 — continuous Windows coverage for the EACCES regression on
    # `TestWorkflowEnvironment.createLocal()`. Single OS × single Node version
    # to keep the CI cost addition under ~17% (one extra job vs. the existing
    # 6 ubuntu × node-version × shard combos). Runs the FULL Mocha suite
    # (no shard split) — Windows runners are slow but the orphan-reaper +
    # createLocal retry layer in `test/helpers.ts` should keep it reliable.
    #
    # Why a separate job rather than `os: [ubuntu-latest, windows-latest]` in
    # the existing matrix: doubling 6 → 12 jobs on every PR is steep, and the
    # Windows-specific failure mode (#150) doesn't need the cross-Node coverage
    # that Linux already provides.
    runs-on: windows-latest
    needs: lint-test-ensemble
    name: build-and-test-windows (node-22)

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Mocha (full suite, no sharding)
        run: npm test

  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check conventional commits
        run: |
          # Verify all PR commits follow conventional commit format
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad_commits=""
          while IFS= read -r line; do
            sha="${line%% *}"
            msg="${line#* }"
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
              bad_commits="${bad_commits}\n  ${sha:0:7} ${msg}"
            fi
          done <<< "$(git log --oneline "$base".."$head")"
          if [ -n "$bad_commits" ]; then
            echo "::warning::Some commits don't follow conventional commit format:${bad_commits}"
          fi
